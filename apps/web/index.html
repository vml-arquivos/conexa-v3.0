<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/branding/cocris/logo-cocris.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="COCRIS Pedagógico — Sistema de Gestão Pedagógica para Educação Infantil" />
    <meta name="theme-color" content="#121413" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f7f6" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Plus+Jakarta+Sans:wght@500..800&display=swap" rel="stylesheet" />
    <script>
      /* Evita o "flash" de tema claro: aplica o tema salvo antes da primeira pintura. */
      try {
        var t = localStorage.getItem("cocris-theme");
        var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) { document.documentElement.classList.add("dark"); document.documentElement.style.colorScheme = "dark"; }
      } catch (e) {}
    </script>
    <title>COCRIS Pedagógico</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
