server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ─── Security: bloquear dotfiles (.env, .git, .htaccess, etc.) ───────────────
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  # ─── Security: bloquear arquivos sensíveis por extensão ──────────────────────
  location ~* \.(env|log|bak|sql|sh|conf|ini|key|pem|crt|p12|pfx)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
  }

  # ─── Security headers ────────────────────────────────────────────────────────
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # PWA: câmera e microfone liberados para o app (captura de fotos no diário/ocorrência)
  add_header Permissions-Policy "camera=self, microphone=(), geolocation=()" always;

  # ─── SPA fallback: qualquer rota vira index.html ─────────────────────────────
  # O HTML nunca deve sobreviver a um redeploy no cache do navegador/proxy,
  # pois ele referencia arquivos JavaScript com hash específico daquele build.
  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # Service Worker e scripts de recuperação também precisam ser revalidados em
  # cada acesso para conseguirem substituir versões antigas com segurança.
  location ~ ^/(sw\.js|sw-device-policy\.js|workbox-[^/]+\.js|registerSW\.js|boot-recovery\.js|manifest\.mobile\.webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # ─── Cache para assets do Vite (hash imutável) ───────────────────────────────
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ─── Healthcheck endpoint ────────────────────────────────────────────────────
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}
